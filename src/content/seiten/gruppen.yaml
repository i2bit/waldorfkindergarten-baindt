titel: Gruppen & Angebote
einleitung: Unser Kindergarten befindet sich in einem eingeschossigen Gebäude in der Erlenstraße 9 der Gemeinde Baindt, nahe der Ortsgrenze zu Baienfurt. Der zur Südseite ausgerichtete, wunderschön angelegte Garten grenzt an eine große Wiese, hinter der sich dann wiederum das Naturschutzgebiet Kiesgrube befindet.
abschnitte:
- titel: ''
  anker: kindergarten
  text: |
    Wir sind eine zweigruppige Einrichtung mit einer altersgemischten Gruppe (Rosenrot), die Kinder ab dem zweiten Lebensjahr aufnimmt und einer Regelgruppe (Schneeweißchen), in der Kinder vom dritten Lebensjahr bis zum Schuleintritt betreut werden können. Für alle Kinder ab drei Jahren besteht die Möglichkeit, die Grundbetreuungszeit von 30 Std/Woche über eine entsprechende Modulbuchung zu erweitern.

    Unser Alltag ist geprägt von sich wiederholenden Tages-, Wochen- und Jahresläufen, ausgeprägten Phasen des freien Spiels sowohl drinnen als auch draußen, intensiver Beziehungsgestaltung, vielfältigen Angeboten zur Entwicklung der Kinder in unterschiedlichen Kompetenzbereichen, nachvollziehbaren, sinnhaften Tätigkeiten der Erwachsenen, einem intensiven Bezug zur Natur und der Gestaltung zahlreicher Jahresfeste.

    Wir frühstücken täglich gemeinsam. Auch die Zubereitung der Mahlzeit ist in den Tageslauf eingebunden. Dabei verwenden wir hochwertige Bioland-Produkte, die uns wöchentlich vom Ährenhof ([Link](https://aehrenhof.de/)) geliefert werden.
