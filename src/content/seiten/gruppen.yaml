- titel: Ganztagesangebot
  anker: ganztag
  text: |
    Für Kinder ab drei Jahren besteht über die entsprechende Modulwahl die Möglichkeit die Grundbetreuungszeit von 30 Std/Woche auf unterschiedliche Art zu erweitern.

    Im Rahmen der Verlängerten Öffnungszeit (= VÖ lang) und der Ganztagesbetreuung (=GT) erhalten die Kinder dann ein Mittagessen und werden, je nach gewähltem Modul, bis 14.15 Uhr bzw. 16.15 Uhr betreut.

    Für die Nutzung der Verlängerten Öffnungszeit stehen derzeit max. 20 Plätze zur Verfügung, für das darüber hinaus gehende Ganztagesangebot 10 Plätze.

    - Dem **Übergang** vom Vor- zum Nachmittag geht ein Austausch der ErzieherInnen voraus, um wichtige Informationen weiterzugeben und das einzelne Kind bewusst wahrzunehmen.
    - Das **Mittagessen** beziehen wir von einem externen Anbieter, der täglich frisch kocht, bio-zertifiziert ist, Zutaten vorzugsweise aus unserer Region verwendet und sich sozial im Rahmen der Integrationsbeschäftigung engagiert. Der aktuelle Speiseplan hängt jeweils in den Gruppengarderoben zur Einsicht aus.
    - Eine **Mittagsruhe** hilft den jüngeren Kindern nach einem ereignisreichen Vormittag zur Ruhe zu kommen, Eindrücke zu verarbeiten und wieder neue Kraft für den Tag zu schöpfen.
    - **Pädagogischer Schwerpunkt am Nachmittag** ist es, sowohl dem Bedürfnis der Kinder nach Ruhe und Geborgenheit als auch dem Verlangen nach Spiel und Bewegung nachzukommen. Alle Tätigkeiten und Angebote haben daher in dieser Zeit einen freilassenden Charakter.

    ### Überblick über den Nachmittagsverlauf

    {% table %}
    ---
    * ab 12.50 Uhr
    * Übernahme der Kinder; Selbstversorgung/Toilettengang
    ---
    * ab 13.00 Uhr
    * Gemeinsames Mittagessen
    ---
    * ab 13.40 Uhr
    * Mittagsruhe der jüngeren Kinder & Freispielzeit
    ---
    * 14.00–14.15 Uhr
    * Abholzeit der zur VÖ-Kinder; Hauswirtschaft/Küche
    ---
    * ab 15.30 Uhr
    * Nachmittagssnack
    ---
    * ab 15.55 Uhr
    * Gemeinsamer Abschluss
    ---
    * 16.00–16.15 Uhr
    * Abholzeit der GT-Kinder
    {% /table %}
