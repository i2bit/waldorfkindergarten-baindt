- titel: Rosenrot
  anker: rosenrot
  text: |
    Unsere Rosenrot-Gruppe ist eine altersgemischte Gruppe, die Kinder ab zwei Jahren aufnimmt. Die Gruppe hat 22 Plätze, wobei Kinder unter drei Jahren immer zwei Plätze belegen. Die tatsächliche Anzahl der Kinder liegt daher deutlich niedriger.

    Im Alter von ca. vier Jahren wechseln die Kinder entweder nach den Sommer- oder nach den Weihnachtsferien in die Nachbargruppe „Schneeweißchen“.

    - **Aufnahmen** erfolgen über das ganze Jahr verteilt, um Eingewöhnungen bedürfnisgerecht gestalten zu können. Aufgenommen werden Kinder im Alter von zwei bis drei Jahren.
    - **Eingewöhnungen** werden angelehnt an das „Berliner Modell“ und orientiert am Entwicklungsstand des Kindes gestaltet. Die sensible Zeit der Eingewöhnung und der Aufbau von vertrauensvoller Bindung erfordert von Eltern und Erziehern die Bereitschaft zur intensiven Zusammenarbeit und ist so individuell wie jedes Kind.
    - **Pädagogischer Schwerpunkt** ist, neben dem Aufbau verlässlicher Bindung, eine behutsame Gestaltung von Umgebung und Abläufen, um den Kindern Hülle, Geborgenheit und Sicherheit zu geben. Angebotene Tätigkeiten haben einen freilassenden Charakter. Dem freien Spiel, der individuellen Zuwendung, achtsamer Pflege sowie Angeboten zur Sinnespflege und Bewegungsentwicklung wird ein hoher Stellenwert eingeräumt.
    - Der **Tages- & Wochenlauf** ist geprägt vom rhythmischen Wechsel zwischen freiem Spiel und gemeinsamer Tätigkeit. Die ErzieherInnen erledigen während der Freispielphasen Arbeiten, die in unmittelbarem Zusammenhang zum Gruppengeschehen stehen und an denen die Kinder sich jederzeit beteiligen dürfen. Darüber hinaus werden noch Tätigkeiten angeboten, die z.B. der Sinnespflege oder dem künstlerischen Ausdruck dienen.

    ### Der Tageslauf:

    {% table %}
    ---
    * ab 07.15 Uhr
    * Ankommen; Freies Spiel; Frühstückszubereitung und Tisch decken; Praktische und künstlerische Tätigkeiten
    ---
    * ab 09.00 Uhr
    * Kleiner Snack mit Apfelschnitzen und Knäckebrot
    ---
    * ab 09.45 Uhr
    * Gemeinsames Aufräumen; Toilettengänge; Selbstversorgung und Pflege
    ---
    * ab 10.00 Uhr
    * Reigen mit Versen, Liedern & Bewegung; Morgenkreis und Sinnespflege
    ---
    * ab 10.15 Uhr
    * Gemeinsames Frühstück; anschließend Selbstversorgung und Pflege
    ---
    * ab 10.45 Uhr
    * Freies Spiel im Garten und anschließend gemeinsames Aufräumen
    ---
    * ab 12.15 Uhr
    * Gemeinsamer Abschluss mit Geschichte, Puppen-, Tanz- oder Singspielen
    ---
    * ab 12.30 Uhr
    * Abholzeit mit Freiem Spiel oder Kreisspielen
    {% /table %}

    ### Der Wochenlauf:

    {% table %}
    *
    * Frühstück
    * Tätigkeiten/Angebote
    ---
    * Montag
    * Milchreis mit Apfelmus und Zimt/Zucker
    * Teig vorbereiten/kneten; Nüsse knacken
    ---
    * Dienstag
    * Brötchen mit Marmelade, Käse und Gemüse
    * Brötchen backen & Gemüse schneiden
    ---
    * Mittwoch
    * Müsli mit Obst, Rosinen und Nüssen
    * Obst schneiden fürs Müsli & Möhren für Suppe; Aquarellmalen (Nass in Nass-Technik)
    ---
    * Donnerstag
    * Nudelsuppe mit Möhren
    * Fußbad
    ---
    * Freitag
    * Vollkornbrot mit Gemüse und Obst
    * Gemüse schneiden, Brote streichen; jahreszeitlich orientierte Angebote
    {% /table %}
