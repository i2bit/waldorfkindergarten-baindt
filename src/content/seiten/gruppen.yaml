- titel: ''
  anker: gemeinschaft
  text: |
    Um den, sich aufgrund ihres Alters und Entwicklungsstandes stark voneinander unterscheidenden Bedürfnissen der Kinder, gerecht werden zu können, arbeiten wir in festen Gruppen mit klarer Raum-, Material und Personenzuordnung.

    Eine enge Zusammenarbeit zwischen den beiden Gruppen findet aber dennoch statt. So begegnen wir uns täglich im Gartenfreispiel. Kleine „Boten“ überbringen – mal schüchtern, mal stolz – Nachrichten. Wir laden uns gegenseitig zu Puppen- und Rollenspielen ein, beschenken uns zu festlichen Angelegenheiten, feiern gemeinsam, helfen einander und pflegen eine familiäre Atmosphäre, in der die Kinder sich geborgen fühlen.
