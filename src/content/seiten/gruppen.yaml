- titel: Kooperationen
  anker: kooperationen
  text: |
    Wir kooperieren mit verschiedensten Einrichtungen, Sozialen Diensten, Schulen und Institutionen.
    Einige Beispiele:

    - Mit den **Waldorfkindertagesstätten** der Teilregion Ravensburg und der Region Bodensee-Oberschwaben treffen wir uns regelmäßig zur fachlichen Weiterbildung und kollegialen Beratung.
    - Mit der **Fachberatung** erarbeiten wir in Inhouse-Fortbildungen pädagogische Themen, reflektieren unser eigenes Handeln im Alltag durch Hospitationen und finden Lösungen für Fragestellungen zur Teamentwicklung.
    - Mit dem [**Heilpädagogischen Dienst**](https://www.diakonie-ravensburg.de/kitas/heilpaedagogischer-fachdienst/), der von der Gemeinde Baindt zur Verfügung gestellt wird, arbeiten wir bei der Begleitung von Kindern mit besonderen Bedürfnissen im Rahmen von Hospitationen und Gesprächen zusammen.
    - Mit der [**Frühförderstelle Mobile**](http://www.fruehfoerderung-rv.de/) arbeiten wir bei der Entwicklungsbegleitung, im Austausch und an gemeinsamen Runden Tischen zusammen.
    - Mit der **Baindter Grundschule** arbeiten wir im Rahmen der allgemeinen Grundschulkooperation sowie über die Durchführung des Programms „Sprach-Fit“ zusammen und stehen seit vielen Jahren in engem Austausch.
    - Mit der [**Waldorfschule Ravensburg**](http://www.waldorfschule-ravensburg.de/) findet ein regelmäßiger Austausch statt. Kinder, die diese Schule zukünftig besuchen, nehmen bereits am angebotenen Vorschulprogramm teil. Auf Anfrage gestalten Waldorflehrer Elternabende bei uns.
    - Mit der **anthroposophischen Ärztin** arbeiten wir in erster Linie bei der Durchführung der ESU zusammen, können uns aber auch bei besonderen Fragestellungen zu einzelnen Kindern Hilfe durch Hospitationen und Gespräche holen.
    - Mit dem [**Bildungszentrum St. Konrad**](https://www.bz-st-konrad.de/) finden jährlich Gespräche über die dahin wechselnden zukünftigen Grundschüler statt.
    - Mit dem **Jugendamt Ravensburg** arbeiten wir im Bereich Fort- und Weiterbildungen, Kindeswohlgefährdung und Infoveranstaltungen für Leitungen & Träger zusammen.
    - Mit der **Gemeinde Baindt** findet Zusammenarbeit und regelmäßiger Austausch sowohl mündlicher Art bei gemeinsamen Treffen als auch durch die Übermittlung und den Abgleich verschiedenster Meldungen statt.
