- titel: Schneeweißchen
  anker: schneeweisschen
  text: |
    Unsere Schneeweißchen-Gruppe ist eine Regelgruppe mit 25 Plätzen, die Kinder ab drei Jahren aufnehmen kann.

    - **Aufnahmen** erfolgen schwerpunktmäßig zu Beginn des Kindergartenjahres im September/Oktober und zu Beginn des Kalenderjahres. Die Anzahl freier Plätze für Neuaufnahmen ist abhängig von der Anzahl aufzunehmender Wechselkinder aus Rosenrot.
    - **Eingewöhnungen** werden je nach Entwicklungsstand, vorhandenen Erfahrungen und in enger Absprache mit den Eltern gestaltet. Die Aufnahmen der Wechselkinder unterscheiden sich grundsätzlich von denen der Kinder, die neu zu uns kommen. Während letztere bereits durch zahlreiche Kontakte und Besuche auf ihren Gruppenwechsel vorbereitet werden, bedürfen Kinder, die ganz neu zu uns kommen, zunächst der Begleitung durch die Eltern, um Sicherheit zu gewinnen und eine tragfähige Beziehung zu den ErzieherInnen aufbauen zu können.
    - **Pädagogischer Schwerpunkt** der Gruppe ist neben der Pflege verlässlicher Bindungen, der Ausbau und die Weiterentwicklung eines erfüllten Spielverhaltens, die Förderung von Fähigkeiten und Fertigkeiten in den unterschiedlichen Kompetenzbereichen, sowie die Begleitung der Entwicklung hin zum angehenden Schulkind.
    - Der **Tages- & Wochenlauf** ist geprägt von Rhythmus und Wiederholung, vom Wechsel zwischen freiem Spiel bzw. auch frei gewählter Betätigung und gemeinsamen Aktivitäten oder auch an das Kind herangetragenen Anforderungen.

    ### Der Tageslauf

    {% table %}
    ---
    * ab 07.15 Uhr
    * Freies Spiel; Frühstückszubereitung; Praktische u. künstlerische Tätigkeit
    ---
    * ab 09.30 Uhr
    * Gemeinsames Aufräumen; Toilettengänge und Selbstversorgung; Tisch decken
    ---
    * ab 09.45 Uhr
    * Reigen oder Rollenspiel; Sprachpflege; Morgenkreis und Sinnespflege
    ---
    * ab 10.15 Uhr
    * Gemeinsames Frühstück; anschließend Selbstversorgung; Spülen/Abtrocknen
    ---
    * ab 10.45 Uhr
    * Freies Spiel im Garten und anschließend gemeinsames Aufräumen
    ---
    * ab 12.15 Uhr
    * Gemeinsamer Abschluss mit Märchen, Geschichte oder Puppenspiel
    ---
    * ab 12.30 Uhr
    * Abholzeit mit freiem Spiel oder Kreisspielen
    {% /table %}

    ### Der Wochenlauf

    {% table %}
    *
    * Frühstück
    * Tätigkeiten/Angebote
    ---
    * Montag
    * Milchreis mit Apfelmus und Zimt/Zucker
    * Teig vorbereiten/kneten; Bienenwachskneten und/oder Fußbad
    ---
    * Dienstag
    * Brötchen mit Marmelade, Käse und Gemüse
    * Brötchen backen & Gemüse/Käse schneiden; Nähen, Häkeln, Stricken, Knüpfen, Werkeln
    ---
    * Mittwoch
    * Müsli mit Obst, Rosinen und Nüssen
    * Obst schneiden für‘s Müsli & Möhren für Suppe; Aquarellmalen (Nass in Nass-Technik); „Zauberstunde“: ein Angebot für die Großen
    ---
    * Donnerstag
    * Nudelsuppe mit Möhren
    * Malen mit Wachsmalfarben; Eurythmie
    ---
    * Freitag
    * Vollkornbrot mit Gemüse und Obst
    * Gemüse schneiden, Brote streichen; Gruppenpflege; Wald-/Naturtag
    {% /table %}
