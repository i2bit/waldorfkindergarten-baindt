titel: Stellen & Mitarbeit
einleitung: Unser Kindergarten bietet vielfältige Möglichkeiten des Kennenlernens und der Mitarbeit. Wir begleiten unterschiedliche Praktikas, stellen 1 FSJ-Stelle pro Kindergartenjahr zur Verfügung und stehen Auszubildenden und Studierenden als kompetente Praxisanleitung zur Seite.
abschnitte:
- titel: ''
  anker: bewerbung
  text: |
    Bewerbungen nehmen wir bevorzugt per Mail entgegen und laden dann zeitnah zu einem Kennenlerngespräch ein. Anschließend ermöglichen wir gern zunächst eine Hospitation bei uns im Alltag, damit jede(r) wirklich die Grundlage für eine gute Entscheidung hat.
