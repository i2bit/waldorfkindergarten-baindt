titel: Datenschutz
einleitung: Informationen zur Verarbeitung personenbezogener Daten auf dieser Website.
abschnitte:
- titel: 1. Verantwortlicher
  anker: ''
  text: |
    Verantwortlich für die Datenverarbeitung auf dieser Website ist der Förderverein Waldorfpädagogik e.V., Erlenstraße 9, 88255 Baindt, Telefon 07502 / 5558664, E-Mail [waldorfkindergarten-baindt@gmx.de](mailto:waldorfkindergarten-baindt@gmx.de), vertreten durch den Vorstand (siehe [Impressum](/impressum)).
  bildAlt: ''
  hintergrund: hell
  baustein: nichts
  aufStartseite: false
  kurz: ''
- titel: 2. Grundsätzliches
  anker: ''
  text: |
    Wir verarbeiten personenbezogene Daten nur, soweit dies für den Betrieb dieser Website und die Kommunikation mit Ihnen erforderlich ist. Diese Website verwendet keine Cookies, keine Analyse- oder Tracking-Werkzeuge und keine Social-Media-Plugins.
  bildAlt: ''
  hintergrund: hell
  baustein: nichts
  aufStartseite: false
  kurz: ''
- titel: 3. Hosting und Server-Logfiles
  anker: ''
  text: |
    Diese Website wird bei **[Name und Anschrift des Hosting-Anbieters – bitte ergänzen]** gehostet. Beim Aufruf der Seiten verarbeitet der Hosting-Anbieter automatisch Daten, die Ihr Browser übermittelt: IP-Adresse, Datum und Uhrzeit des Zugriffs, aufgerufene Seite, Referrer-URL, Browsertyp und Betriebssystem. Dies dient der sicheren und stabilen Bereitstellung der Website (Art. 6 Abs. 1 lit. f DSGVO). Die Logdaten werden nach spätestens **[7 – bitte prüfen]** Tagen gelöscht. Mit dem Anbieter besteht ein Vertrag zur Auftragsverarbeitung nach Art. 28 DSGVO.
  bildAlt: ''
  hintergrund: hell
  baustein: nichts
  aufStartseite: false
  kurz: ''
- titel: 4. Kontakt per E-Mail oder Telefon
  anker: ''
  text: |
    Wenn Sie uns per E-Mail oder Telefon kontaktieren, verarbeiten wir Ihre Angaben zur Bearbeitung Ihres Anliegens, etwa zu einem Kindergartenplatz oder einer Bewerbung (Art. 6 Abs. 1 lit. b und f DSGVO). Für E-Mails nutzen wir den Dienst GMX. Wir löschen Ihre Daten, sobald sie nicht mehr benötigt werden und keine gesetzlichen Aufbewahrungspflichten entgegenstehen.
  bildAlt: ''
  hintergrund: hell
  baustein: nichts
  aufStartseite: false
  kurz: ''
- titel: 5. Online-Aufnahmeantrag
  anker: ''
  text: |
    Das Formular unter [Aufnahmeantrag](/anmeldung) überträgt keine Daten an unseren Server und speichert nichts. Beim Absenden öffnet sich Ihr eigenes E-Mail-Programm mit einer vorausgefüllten Nachricht an uns. Erst wenn Sie diese E-Mail abschicken, erhalten wir Ihre Angaben. Wir verarbeiten sie zur Bearbeitung Ihres Aufnahmeantrags (Art. 6 Abs. 1 lit. b DSGVO) und auf Grundlage Ihrer Einwilligung (Art. 6 Abs. 1 lit. a DSGVO, bei Angaben zur Gesundheit Art. 9 Abs. 2 lit. a DSGVO). Wird Ihr Kind nicht aufgenommen, löschen wir die Daten nach Abschluss der Platzvergabe, sofern Sie nicht weiter informiert werden möchten.
  bildAlt: ''
  hintergrund: hell
  baustein: nichts
  aufStartseite: false
  kurz: ''
- titel: 6. Schriftarten
  anker: ''
  text: |
    Die verwendeten Schriftarten sind lokal auf unserem Server eingebunden. Beim Seitenaufruf wird keine Verbindung zu Servern Dritter wie Google hergestellt.
  bildAlt: ''
  hintergrund: hell
  baustein: nichts
  aufStartseite: false
  kurz: ''
- titel: 7. Externe Links und Dokumente
  anker: ''
  text: |
    Unsere Seiten verlinken auf Angebote Dritter, etwa die Gemeinde Baindt oder OpenStreetMap. Erst wenn Sie einem solchen Link folgen, gelten die Datenschutzbestimmungen des jeweiligen Anbieters.
  bildAlt: ''
  hintergrund: hell
  baustein: nichts
  aufStartseite: false
  kurz: ''
- titel: 8. Ihre Rechte
  anker: ''
  text: |
    Sie haben das Recht auf Auskunft (Art. 15 DSGVO), Berichtigung (Art. 16), Löschung (Art. 17), Einschränkung der Verarbeitung (Art. 18), Datenübertragbarkeit (Art. 20) und Widerspruch gegen Verarbeitungen auf Grundlage berechtigter Interessen (Art. 21). Eine erteilte Einwilligung können Sie jederzeit widerrufen. Wenden Sie sich dazu einfach an die oben genannte Adresse.

    Außerdem können Sie sich bei einer Datenschutz-Aufsichtsbehörde beschweren, zum Beispiel beim Landesbeauftragten für den Datenschutz und die Informationsfreiheit Baden-Württemberg in Stuttgart.
  bildAlt: ''
  hintergrund: hell
  baustein: nichts
  aufStartseite: false
  kurz: ''
- titel: 9. Verschlüsselung
  anker: ''
  text: |
    Diese Website nutzt aus Sicherheitsgründen eine SSL/TLS-Verschlüsselung. Sie erkennen sie am Schloss-Symbol und an „https://“ in der Adresszeile.

    Stand: Oktober 2026
  bildAlt: ''
  hintergrund: hell
  baustein: nichts
  aufStartseite: false
  kurz: ''
