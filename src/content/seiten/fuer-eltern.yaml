- titel: Beiträge
  anker: beitraege
  text: |
    [**Folgende Beiträge gelten für das Kindergartenjahr 26/27**](/downloads/gebuehrentabelle-2026-27.pdf)

    [**Formular Buchungs-/Umbuchungsantrag eines Moduls**](/downloads/buchungsantrag-module.pdf)

    - Die Buchung des benötigten Betreuungsumfangs erfolgt in Form von Modulen.
    - Der Beitrag wird 11-monatig (der August ist beitragsfrei) immer zu Beginn des Monats per SEPA-Lastschriftmandat eingezogen.
    - Modulumbuchungen sind immer zum September, Januar und März möglich. Darüber hinaus ist eine Umbuchung nur aus besonders wichtigem Grund möglich.
    - Das Modul 1 A mit einer Betreuungszeit von 30 Stunden/Woche setzt den garantierten Rechtsanspruch um und steht allen Kindern/Familien zur Verfügung.
    - Für die Betreuungsmodule 1 B / 3 A / 3 B gilt:
      - Buchbar ab vollendetem 3. Lebensjahr
      - Mindestanmeldezahl von 5 Kindern
      - Bei mehr Anmeldungen als Plätzen werden die Vergabekriterien angewendet
      - Notwendiger Mindestpersonalschlüssel steht zur Verfügung
    - Es muss Mittagessen bestellt werden. Die Kosten hierfür werden zusätzlich berechnet. Der Betrag pro Mittagessen beträgt aktuell: 5,80 €. Für rechtzeitig abbestellte Essen (z.B. wegen Krankheit) erfolgt die Rückerstattung vierteljährlich.
  bildAlt: ''
