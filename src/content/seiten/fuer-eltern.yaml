- titel: Organisation
  anker: organisation
  text: |
    Unsere Einrichtung ist ein Kindergarten in sogenannter freier Trägerschaft mit einer vom KVJS (Kommunalverband für Jugend und Soziales Baden-Württemberg) erteilten Betriebserlaubnis, in der die Rahmenbedingungen wie räumliche und personelle Mindestausstattungen sowie mögliche Gruppengrößen und -zusammensetzungen festgelegt sind.

    In der Organisationsform der Selbstverwaltung teilen sich der Vorstand des „Fördervereins Waldorfpädagogik e.V.“, Kindergartenleitung und Pädagogisches Team alle Arbeiten, die für den Betrieb einer Kindertagesstätte nötig sind und anfallen (über die Betreuung der Kinder während der Öffnungszeiten hinausgehend).
  bildAlt: ''
  hintergrund: honig
  baustein: nichts
  aufStartseite: false
  kurz: ''
- titel: Vereinsmitgliedschaft
  anker: mitgliedschaft
  text: |
    Die Mitgliedschaft im „Förderverein Waldorfpädagogik“ ist für Eltern während der Zeit, in der ihr Kind den Kindergarten besucht, verbindlich, da der Verein Träger und somit Grundlage für die Existenz der Einrichtung ist.

    Nach Beendigung der Kindergartenzeit kann die Mitgliedschaft aufrechterhalten oder gekündigt werden. Eine Kündigung bedarf der Schriftform.

    Man kann dem Verein als förderndes, d.h. nicht stimmberechtigtes Mitglied, oder als ordentliches, d.h. stimm- und wahlberechtigtes Mitglied beitreten.

    **[Hier](/downloads/aufnahmeantrag-foerderverein.pdf)** können Sie den Aufnahmeantrag des Fördervereins downloaden.
  bildAlt: ''
  hintergrund: hell
  baustein: nichts
  aufStartseite: false
  kurz: ''
- titel: Jahresplan
  anker: jahresplan
  text: |
    Unser Jahresplan gibt einen Überblick über nahezu alle Termine des gesamten Kindergartenjahres.

    Während die fettgedruckten Einträge sowohl für Eltern als auch Pädagogisches Team relevant sind, betreffen die in Normaldruck hinterlegten Einträge in erster Linie die Mitarbeiter der Einrichtung.

    Folgende Kürzel werden im Wesentlichen verwendet:\
    RR = Rosenrot\
    SW = Schneeweißchen\
    NM = Nachmittag\
    EA = Elternabend\
    VS = Vorstand\
    EB = Elternbeirat

    [Aktueller Jahresplan 26/27](/downloads/jahresplan-2026-27.pdf)
