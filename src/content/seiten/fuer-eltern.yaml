- titel: Öffnungszeiten/Module
  anker: zeiten
  text: |
    - Während der Eingewöhnungsphasen vereinbaren wir die Bring-, Verweil- und Abholzeiten immer individuell und orientiert am Stand der Eingewöhnung mit den jeweiligen Eltern.
    - Abweichende Bring-/Abholzeiten sind aus triftigen Gründen (z.B. Arzt-/Therapietermine) möglich, bedürfen aber der vorherigen Absprache
    - Bei Krankheit, Urlaub oder Pausentagen bitten wir um Benachrichtigung.
