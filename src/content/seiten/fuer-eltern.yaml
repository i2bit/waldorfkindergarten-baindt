- titel: Anmeldung
  anker: anmeldung
  text: |
    **Zentrales Vormerkeverfahren & Vergabekriterien:**

    Die Anmeldung für einen Kindergartenplatz erfolgt immer über das Zentrale Vormerkeverfahren der Gemeinde Baindt. Bei der Platzvergabe finden die für alle Kindergärten der Gemeinde festgelegten Vergabekriterien Anwendung.

    - [**Vormerkung und Vergabekriterien der Gemeinde Baindt**](https://www.baindt.de/leben-wohnen/kindertageseinrichtungen/vormerkung-und-vergabekriterien-kindertageseinrichtungen)

    **Aufnahmeantrag Waldorfkindergarten Baindt:**

    Da unser Kindergarten von der Zusammenarbeit zwischen Eltern und Erziehern lebt und sich als ein Ort der Begegnung auch vor und nach der aktiven Kindergartenzeit versteht, erbitten wir bei Interesse an einem Platz bei uns zusätzlich die Zusendung unseres internen Aufnahmeantrags.

    Dies eröffnet uns die Möglichkeit mit Ihnen frühzeitig in Kontakt zu treten und Sie auch schon vorab über Veranstaltungen zu informieren bzw. Sie daran teilhaben zu lassen.

    - [**Formular Aufnahmeantrag**](/downloads/aufnahmeantrag-kindergarten.pdf)

    **Kennenlernen & Information:**

    Gerne bieten wir interessierten Eltern nach vorheriger Terminvereinbarung einen Termin als Möglichkeit an, um sich vor Ort umzusehen und sich einen Eindruck von uns zu verschaffen. In dieser Zeit steht ein Mitarbeiter als Ansprechpartner für Fragen und Auskünfte zur Verfügung.

    Auf Anfrage oder bei einem persönlichen Besuch können interessierte Eltern zudem gerne unsere umfangreiche Kiga-Mappe bekommen, die neben vielen Informationen auch alle notwendigen Formulare, die bei einer Aufnahme in unseren Kindergarten benötigt werden, enthält.

    **Aufnahme:**

    Wenn wir interessierten Eltern einen Platz zur Verfügung stellen können, folgt der Platzzusage das Aufnahmegespräch. Neben Vertragsabschluss sowie organisatorischen Infos und Vereinbarungen kommt hierbei dem Pädagogischen Aufnahmegespräch, in dem wir uns der bisherigen Biografie der Kinder widmen, eine besondere Bedeutung zu.
  bildAlt: ''
  hintergrund: hell
  baustein: anmeldung
