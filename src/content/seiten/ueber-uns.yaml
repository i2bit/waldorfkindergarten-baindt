- titel: Unser Alltag
  anker: alltag
  text: |
    Aufgrund des Wissens um die kindlichen Bedürfnisse ist unser Alltag geprägt von:

    - Intensiver Beziehungsgestaltung und Sinnespflege
    - Rhythmischen, sich wiederholenden Tages-, Wochen- und Jahresläufen
    - Einem engen Bezug zur Natur, den Jahreszeiten und den Jahresfesten
    - Unterschiedlichsten Bewegungserfahrungen
    - Natürlichen Spielmaterialien, welche die Phantasie der Kinder stärken
    - Intensiven Phasen des freien Spiels drinnen und draußen
    - Sinnvollen Tätigkeiten, die in einem unmittelbaren Lebenszusammenhang stehen
    - Sprachlicher Vielfalt im Alltag sowie in Liedern, Reimen, Geschichten und Spielen
    - Vielfältigen Möglichkeiten des künstlerischen Ausdrucks
    - Gesunder Ernährung, gemeinsamen Mahlzeiten und achtsamer Pflege
    - Enger Zusammenarbeit mit den Eltern

    Einige Elemente des Alltags und der Angebote im Bereich der Waldorfpädagogik unterscheiden sich mehr oder weniger stark von Kindertagesstätten in anderer Trägerschaft.

    So hat bei uns z. B. die Eurythmie, eine Bewegungskunst, die Sprache ganzheitlich körperlich darstellt, ebenso ihren festen Platz wie der tägliche Reigen, in dem wir mit Versen, Liedern und Bewegung darstellen, was wir in der Natur, im Jahreslauf gerade erleben.

    Liebevoll dekorierte Jahreszeitentische laden die Kinder zum Staunen und Verweilen ein und der Aufenthalt in unserem wunderschönen Garten gehört für uns auch bei Regen zu einem unverzichtbaren Bestandteil des Tagesablaufes.
