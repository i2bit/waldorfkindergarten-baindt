- titel: Pädagogik
  anker: paedagogik
  text: |
    **„Das Kind in Ehrfurcht aufnehmen, in Liebe erziehen und in Freiheit entlassen.“** (R. Steiner)

    Die Waldorfpädagogik basiert auf dem anthroposophischen Menschenbild Rudolf Steiners, das Entwicklungsgesetzmäßigkeiten beschreibt und in jedem Kind eine unantastbare Individualität sieht.

    Uns ist es ein Grundanliegen, den Kindern einen gesunden und geschützten Lebensraum zu schaffen, der es ihnen ermöglicht, sich frei nach den ihnen innewohnenden Impulsen zu entfalten und ihren Platz in dieser, unserer Welt finden zu können.

    Die Basis unserer pädagogischen und organisatorischen Arbeit bildet unsere Konzeption, in der sich neben Hintergründen, Prioritäten und Methodik der Waldorfpädagogik auch die Inhalte des Bildungs- und Orientierungsplans des Landes Baden-Württemberg und deren einrichtungsinterne Umsetzung wiederfinden.

    Für eine gesunde, ganzheitliche Entwicklung braucht das Kind kompetente Vorbilder, liebevolle und stabile Beziehungsverhältnisse, durchschaubare und sich verlässlich wiederholende Abläufe sowie sinnhaft tätige Erwachsene in seiner Umgebung.

    Das Kind selbst trägt in sich einen Quell unerschöpflicher Aktivität, es bildet und entwickelt sich aus eigenem Antrieb heraus. Die innere Haltung und das äußere Tun des Erwachsenen aber bilden dabei die erste elementare Lernumgebung.
