- titel: Elternarbeit
  anker: elternarbeit
  text: |
    Unsere Zusammenarbeit mit den Eltern betrachten wir als Erziehungspartnerschaft zum Wohle des Kindes. Im Wissen darum, dass uns die Eltern ihr kostbarstes „Gut“, ihr Kind anvertrauen, liegt uns ein wohlwollendes Verhältnis zwischen Eltern und Erziehern ebenso am Herzen wie eine enge Zusammenarbeit und ein intensiver Austausch.

    Gegenseitiges Vertrauen und Anerkennung ermöglicht einerseits Akzeptanz und Kompromissbereitschaft und schafft andererseits den Rahmen, in dem Mut zur Auseinandersetzung fruchtbar gelebt werden kann.

    - **Elternabende** finden bei uns regelmäßig, ca. fünf- bis sechsmal jährlich in Form von Gesamt- und/oder Gruppenelternabenden statt.
    - **Elterngespräche** finden bei uns pro Kind mindestens einmal jährlich in Form eines vorbereiteten ca. einstündigen Entwicklungsgespräches bzw. täglich in Form von Tür- und Angelgesprächen während der Abholzeit statt. Darüber hinaus gibt es noch den Austausch im Rahmen von Eingewöhnungen sowie Gespräche bei aktuellen Fragestellungen.
    - **Elternhausbesuche** sind eine weitere Möglichkeit der Begegnung, von der Eltern Gebrauch machen können, die jedoch in erster Linie ein Angebot an die Kinder sind, „einmal den Erzieher ganz für sich allein zu haben“.

    Elternarbeit bedeutet bei uns aber noch mehr, denn unsere Eltern sind der Kindergarten! Sie arbeiten in verschiedenen Gremien und Funktionen sowie zu unterschiedlichen Anlässen eng mit dem pädagogischen Team zusammen.

    - Der **Elternbeirat** wird jährlich gewählt und bildet das Bindeglied zwischen Elternschaft, pädagogischem Team und Vereinsvorstand. Neben der Organisation von Festen ist er ins Beschwerdemanagement eingebunden und hat andererseits die Aufgabe, die pädagogische Arbeit zu unterstützen.
    - Die **Öffentlichkeitsarbeit** wird auch im Wesentlichen von Eltern gestaltet, berichtet von Ereignissen der Einrichtung in der lokalen Presse, pflegt diese Homepage und kündigt Veranstaltungen an.
    - Die **Bastelgruppe** trifft sich regelmäßig, um all die schönen Dinge herzustellen, die beim Verkauf auf Basaren freudige Abnehmer finden.
    - Der **„Geschenkedienst“** kümmert sich um kleine Aufmerksamkeiten zu verschiedenen Anlässen.
    - Der **Vorstand** ist die Gruppe aus Eltern, die, von der Mitgliederversammlung des Vereins gewählt, unsere Einrichtung rechtlich nach innen und außen vertritt und in großem Maße die Geschicke unseres Kindergartens lenkt.
