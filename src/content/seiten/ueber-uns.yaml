- titel: Team
  anker: team
  text: |
    In unserer Einrichtung arbeiten gemäß den durch das Kindertagesstättengesetz § 7 vorgegebenen Anforderungen Fachkräfte mit unterschiedlichen Ausbildungsständen (z. B. WaldorferzieherInnen, staatlich anerkannte ErzieherInnen, staatlich anerkannte KinderpflegerInnen, staatlich anerkannte HeilerziehungspflegerInnen mit pädagogischer Zusatzausbildung, ElementarpädagogInnen).

    Diese werden unterstützt durch sogenannte Zusatzkräfte, z. B. Auszubildende, FSJler, Praktikanten oder auch pädagogische Hilfskräfte.

    Bei der Zusammensetzung des Teams streben wir sowohl Heterogenität bezüglich der Ausbildungsstände als auch der Berufserfahrung und des Alters der einzelnen Mitarbeiter an.

    In den Hauptbetreuungszeiten des Vormittags arbeiten wir in konstanten Teams von meist drei MitarbeiterInnen pro Gruppe zusammen. So können wir unserem konzeptionellen Anspruch nach sicheren, stabilen Beziehungsverhältnissen gerecht werden und mit einem Betreuungsschlüssel arbeiten, der eine qualitativ hochwertige pädagogische Arbeit ermöglicht.

    Im Bereich unseres Ganztagesangebotes sind je nach Anzahl der Kinder, die dieses Angebot in Anspruch nehmen, maximal zwei MitarbeiterInnen in der Gruppe.

    Der Besuch von Fort- und Weiterbildungen durch das pädagogische Team ist ausdrücklich erwünscht, teilweise auch verpflichtend in die Jahresplanung integriert und konzeptionell festgehalten.

    Aufgrund unseres pädagogischen Profils kommt dabei Fortbildungen mit waldorfpädagogischen Inhalten ebenso eine besondere Priorität zu, wie es uns ein Anliegen ist, unsere Fachkräfte zu Waldorferziehern weiterbilden zu lassen.
