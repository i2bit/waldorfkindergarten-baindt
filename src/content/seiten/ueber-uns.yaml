titel: Über uns
einleitung: Seit 1985 ein Ort, an dem das Kind im Mittelpunkt steht und in Liebe und Geborgenheit gehüllt aufwachsen darf.
abschnitte:
- titel: Geschichte
  anker: geschichte
  text: |
    Der Gründung unserer Einrichtung ging Ende der 1970er Jahre das Interesse einer Gruppe von Eltern an einer waldorfpädagogischen Einrichtung im Schussental voraus. Gemeinsam mit anderen an der Anthroposophie interessierten Menschen riefen sie 1979 den Arbeitskreis Waldorfpädagogik ins Leben, aus dem drei Jahre später der „Förderverein Waldorfpädagogik e.V.“ hervorging.

    Während die Suche nach geeigneten Räumlichkeiten noch Zeit und Mühe in Anspruch nahm, wurde zu Beginn des Jahres 1984 bereits eine Waldorf-Spielgruppe in Privaträumen eröffnet. Mit dem Erwerb eines Grundstücks und einer ehemaligen Arbeiterbaracke schuf der Verein dann noch im gleichen Jahr die Basis für die Etablierung eines Waldorfkindergartens.

    Dem hohen Engagement der Vereinsmitglieder, die viel Zeit und Kraft in den Umbau investierten, war es zu verdanken, dass dem Umzug der Spielgruppe in das Gebäude schon bald die Aufnahme eines regulären Kindergartenbetriebes folgte.

    Das Jahr 1985 gilt als das Gründungsjahr des Waldorfkindergartens Baindt, der seitdem immer ein Ort war und ist, in dem das Kind im Mittelpunkt steht und in Liebe und Geborgenheit gehüllt aufwachsen darf.
