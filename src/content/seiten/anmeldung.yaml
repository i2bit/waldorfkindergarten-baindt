titel: Aufnahmeantrag
einleitung: Da unser Kindergarten von der Zusammenarbeit zwischen Eltern und Erziehern lebt und sich als ein Ort der Begegnung auch vor und nach der aktiven Kindergartenzeit versteht, erbitten wir bei Interesse an einem Platz bei uns die Zusendung unseres internen Aufnahmeantrags.
abschnitte:
- titel: Zuerst bei der Gemeinde vormerken
  anker: vormerkung
  text: |
    Die Anmeldung für einen Kindergartenplatz erfolgt immer über das Zentrale Vormerkeverfahren der Gemeinde Baindt. Unser Aufnahmeantrag ist nur für die interne Verwendung bestimmt und ersetzt die Vormerkung nicht.

    [Vormerkung und Vergabekriterien der Gemeinde Baindt](https://www.baindt.de/leben-wohnen/kindertageseinrichtungen/vormerkung-und-vergabekriterien-kindertageseinrichtungen)

    Lieber auf Papier? Hier finden Sie den [Aufnahmeantrag als PDF](/downloads/aufnahmeantrag-kindergarten.pdf) zum Ausdrucken.
  bildAlt: ''
  hintergrund: honig
  baustein: nichts
  aufStartseite: false
  kurz: ''
