titel: Aufnahmeantrag
einleitung: Da unser Kindergarten von der Zusammenarbeit zwischen Eltern und Erziehern lebt und sich als ein Ort der Begegnung auch vor und nach der aktiven Kindergartenzeit versteht, erbitten wir bei Interesse an einem Platz bei uns zusätzlich die Zusendung unseres internen Aufnahmeantrags.
abschnitte:
- titel: Zentrales Vormerkeverfahren & Vergabekriterien
  anker: vormerkung
  text: |
    Die Anmeldung für einen Kindergartenplatz erfolgt immer über das Zentrale Vormerkeverfahren der Gemeinde Baindt. Bei der Platzvergabe finden die für alle Kindergärten der Gemeinde festgelegten Vergabekriterien Anwendung.

    - [**Vormerkung und Vergabekriterien der Gemeinde Baindt**](https://www.baindt.de/leben-wohnen/kindertageseinrichtungen/vormerkung-und-vergabekriterien-kindertageseinrichtungen)
    - [**Formular Aufnahmeantrag**](/downloads/aufnahmeantrag-kindergarten.pdf)
  bildAlt: ''
  hintergrund: honig
  baustein: nichts
  aufStartseite: false
  kurz: ''
