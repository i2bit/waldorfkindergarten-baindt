einleitung: >-
  Unser Kindergarten liegt in einem eingeschossigen Haus in der Erlenstraße, nahe der Ortsgrenze zu Baienfurt. Der Garten nach Süden grenzt an eine große Wiese und dahinter an das Naturschutzgebiet Kiesgrube.
gruppen:
  - name: Rosenrot
    alter: ab dem 2. Lebensjahr
    text: >-
      Unsere altersgemischte Gruppe für Kinder von etwa 2 bis 4 Jahren. Hier kommen die Kinder in kleinen Schritten an – mit viel Zeit für Eingewöhnung, Beziehung und Geborgenheit.
    punkte:
      - 22 Plätze – weil Zweijährige doppelt zählen, sind es tatsächlich rund 15 Kinder.
      - Mit etwa vier Jahren wechseln die Kinder, je nach Entwicklungsstand, zu Schneeweißchen.
  - name: Schneeweißchen
    alter: ab 3 Jahren bis zur Schule
    text: >-
      Unsere Regelgruppe für Kinder vom 3. Lebensjahr bis zum Schuleintritt.
    punkte:
      - Platz für bis zu 25 Kinder.
      - Im letzten Jahr vor der Schule begleitet unser Vorschulprogramm die „Großen“.
alltag: >-
  Wir frühstücken täglich gemeinsam, und die Kinder helfen bei der Zubereitung mit. Dafür verwenden wir Bioland-Produkte vom Rössler-Hof. Einmal pro Woche backen wir unsere Frühstücksbrötchen selbst.
