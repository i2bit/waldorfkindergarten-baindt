zitat: |-
  In jedem Kind träumt Gott den Traum der Liebe,
  in jedem Kind wacht ein Stück vom Himmel auf,
  in jedem Kind blüht Hoffnung, wächst die Zukunft,
  in jedem Kind wird unsre Erde neu.
zitatQuelle: ''
heroText: >-
  Seit 1985 in Baindt: zwei Gruppen, ein großer Garten am Naturschutzgebiet und ein Tag mit Rhythmus – für Kinder ab dem 2. Lebensjahr bis zum Schuleintritt.
