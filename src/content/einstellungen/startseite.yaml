zitat: |-
  In jedem Kind träumt Gott den Traum der Liebe,
  in jedem Kind wacht ein Stück vom Himmel auf,
  in jedem Kind blüht Hoffnung, wächst die Zukunft,
  in jedem Kind wird unsere Erde neu.
zitatQuelle: ''
willkommenTitel: Willkommen
willkommen: |
  Im Mittelpunkt der Arbeit in unserer Einrichtung steht das Kind, das jedes für sich als Geschenk zu uns kommt und bedingungslose Liebe erwartet.

  Kinder brauchen Geborgenheit, liebevolle Hülle und einen geschützten Freiraum, in dem sie ihrem individuellen Lebensentwurf entsprechend heranreifen, wachsen und gedeihen können.

  Wir begleiten jedes einzelne Kind während seiner Zeit bei uns mit Liebe, Freude und Bejahung und helfen ihm dabei, seinen Platz in unserer Welt finden zu können.
platzTitel: Interesse an einem Platz?
platzText: Gerne bieten wir interessierten Eltern nach vorheriger Terminvereinbarung einen Besuch an, um sich vor Ort umzusehen und sich einen Eindruck von uns zu verschaffen.
